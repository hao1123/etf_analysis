name: ETF Strategy

on:
  workflow_dispatch:
    inputs:
      job:
        description: '要执行的任务'
        required: true
        type: choice
        default: 'morning'
        options:
          - morning
          - weak
          - rebalance
          - reset
          - close
          - stop
      dry_run:
        description: 'Dry-run 模式（只打印不发通知）'
        required: false
        type: boolean
        default: false

concurrency:
  group: etf-strategy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      SMTP_SSL: '1'
      SMTP_STARTTLS: '0'
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
      HOLDINGS_AMOUNT: ${{ secrets.HOLDINGS_AMOUNT }}
      ETF_USE_SYSTEM_PROXY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data
          key: etf-data-${{ github.run_id }}
          restore-keys: etf-data-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-etf.txt

      - name: Determine job
        id: job
        run: |
          JOB="${{ github.event.inputs.job }}"
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "Selected job: $JOB"

      - name: Run ETF job
        run: |
          DRY_FLAG=""
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            DRY_FLAG="--dry-run"
          fi
          python etf.py once "${{ steps.job.outputs.job }}" $DRY_FLAG
